* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {

.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

.id img { width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); }

}

/* sections */
section { margin-top: 36px; }

/* quick access */
.quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.tile {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 64px;

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.search { position: relative; flex: 1 1 260px; }
.search input {

}
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {

select.sort {

/* cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.card {

.card .cat { font-size: .75rem; font-weight: 700; color: var(--cat); letter-spacing: .02em; }
.card h3 { margin: 4px 0 0; font-size: 1.125rem; line-height: 1.35; letter-spacing: -0.01em; }

.card p.desc { margin: 10px 0 0; }
.card ul { margin: 10px 0 0; padding-left: 18px; color: var(--muted); font-size: .9375rem; }
.card li + li { margin-top: 2px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tag { font-size: .75rem; padding: 3px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); font-weight: 600; }
.meta { margin-top: 12px; font-size: .8125rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 16px; }
.actions .note { font-size: .8125rem; color: var(--muted); align-self: center; }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }

details.more { margin-top: 28px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
details.more summary { cursor: pointer; padding: 14px 18px; font-weight: 600; list-style-position: inside; }
details.more .inner { padding: 0 18px 18px; }
.mini { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.mini li { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 0; border-top: 1px solid var(--line); }
.mini li:first-child { border-top: 0; }
.mini .t { flex: 1; min-width: 200px; }
.mini .t b { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .875rem; }
.mini .t span { display: block; font-size: .875rem; color: var(--muted); }
.mini .btn { min-height: 36px; padding: 6px 12px; font-size: .875rem; }

footer { margin: 48px 0 32px; color: var(--muted); font-size: .8125rem; }

@media (max-width: 520px) {
  header.top { padding-top: 28px; }

  .tile { padding: 10px; gap: 10px; }

  .tile .kind { display: none; }
  .search kbd { display: none; }
  .search input { padding-right: 12px; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .tile, .chip { transition: border-color .15s, filter .15s, background .15s; }
}

    points: ['클리어 타임 또는 남은 HP로 컨트롤 % 계산', '파티 합산 배율과 각자의 기여 비율', '기록 히스토리와 컨트롤 추이 그래프'],

    id: 'ytdl', cat: 'app', title: 'YTDL', mono: 'Y', repos: [], release: { repo: 'releases', prefix: 'YTDL' },
    desc: '유튜브 영상을 커버 이미지 · 싱크 가사(LRC)가 들어간 MP3로 추출하는 Windows 앱.',
    points: ['링크만 넣으면 아티스트 · 앨범 · 커버 자동 채움', '검색어 · 재생목록 일괄 다운로드, MP4도 지원', 'ffmpeg까지 내장한 단일 exe, 자동 업데이트'],
    tags: ['Python', 'pywebview', 'yt-dlp', 'Windows'], closed: true,
  },
  {
    id: 'mp3', cat: 'app', title: 'MP3 Checker', mono: 'M', repos: [], release: { repo: 'releases', prefix: 'MP3Checker' },
    desc: '폴더 안 MP3들의 가사(LRC) · 커버 · 태그 상태를 한눈에 보여 주고 고치는 점검 도구. YTDL과 이어서 쓰면 좋습니다.',
    points: ['곡별 상태 대시보드와 아티스트 → 앨범 브라우저', '태그 편집 · 커버 일괄 지정 · 원본 링크 자동 검색', 'YTDL 스타일 규칙 기준으로 라이브러리 정리'],
    tags: ['Python', 'pywebview', 'Windows'], closed: true,
  },
  {
    id: 'tododoo', cat: 'app', title: 'Tododoo', mono: 'T', repos: [], release: { repo: 'releases', prefix: 'Tododoo' },
    desc: '로컬 우선 할 일 정리 앱. 데이터는 기기에 저장되고, 로그인하면 기기 간 동기화됩니다.',
    points: ['"보고서 쓰기 #업무 !3 @내일" 같은 빠른 입력', '리스트 / 칸반 보드, 프로젝트 · 태그별 보기', '오프라인에서도 그대로 쓰고 다시 연결되면 동기화'],
    tags: ['React', 'TypeScript', 'Tauri', 'Windows · Android'], closed: true,
  },
  {
    id: 'duet', cat: 'game', title: 'Duet 모작', mono: 'D', repos: ['Duet_copy'],
    desc: 'Kumobius의 게임 Duet을 Pygame으로 다시 만든 프로젝트. 원작에 없는 커스텀 레벨 제작 · 공유가 목표였습니다.',
    points: ['1인 개발, 약 4개월 (2024.07 ~ 11)', 'run.bat 또는 main.py로 실행', 'pygame, numpy 필요'],
    tags: ['Python', 'Pygame'],
  },
];

// 수업·연습용: 접어 둔 목록에 짧게만 보여 준다
const PRACTICE = {
  test261026: '학교 수업 실습 (웹 페이지)',
  '26streamlit': 'Streamlit 앱 실습',
  '20260609': 'Python 실습',
  test2026: 'Jupyter 노트북 수업 예제',
  test20524: '학교 수업용 (빈 저장소)',
};
const HIDE = new Set([`${USER}.github.io`, 'releases']);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ICON = {
  open: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  code: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 7-5 5 5 5M16 7l5 5-5 5"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
};

const state = { cat: 'all', q: '', sort: 'pick', repos: {}, releases: {} };

function ago(iso) {
  if (!iso) return '';
  const d = Math.floor((Date.now() - new Date(iso)) / 86400000);
  if (d < 1) return '오늘';
  if (d < 30) return `${d}일 전`;
  if (d < 365) return `${Math.floor(d / 30)}개월 전`;
  return `${Math.floor(d / 365)}년 전`;
}

function updatedAt(p) {
  const times = p.repos.map(r => state.repos[r]?.pushed_at).filter(Boolean);
  const rel = state.releases[p.id];
  if (rel?.date) times.push(rel.date);
  return times.sort().pop() || '';
}

function downloads(p) {
  const rel = state.releases[p.id];
  const fallback = p.release.prefix
    ? `${GH}/releases/releases?q=${encodeURIComponent(p.release.prefix)}`
    : `${GH}/${p.release.repo}/releases/latest`;
  if (!rel || !rel.assets.length) {
    return [`<a class="btn primary" href="${fallback}">${ICON.down} 다운로드</a>`];
  }
  const out = rel.assets.map(a =>
    `<a class="btn primary" href="${esc(a.url)}" aria-label="${esc(p.title)} ${esc(a.label)}용 v${esc(rel.version)} 받기">${ICON.down} ${esc(a.label)}</a>`);
  out.push(`<a class="btn" href="${esc(rel.page)}">릴리스 노트</a>`);
  return out;
}

function card(p) {
  const c = CATS[p.cat];
  const main = state.repos[p.repos[0]];
  const rel = state.releases[p.id];
  const actions = [];
  if (p.live) actions.push(`<a class="btn primary" href="${p.live}" aria-label="${esc(p.title)} 열기">${ICON.open} 열기</a>`);
  if (p.release) actions.push(...downloads(p));
  const sources = p.sources || p.repos.map(r => ['소스', r]);
  for (const [label, r] of sources) actions.push(`<a class="btn" href="${GH}/${r}" aria-label="${esc(p.title)} ${label} (GitHub)">${ICON.code} ${label}</a>`);
  if (p.closed) actions.push('<span class="note">소스 비공개</span>');

  const meta = [];
  const up = updatedAt(p);
  if (up) meta.push(`<span>업데이트 ${ago(up)}</span>`);
  if (rel?.version) meta.push(`<span>최신 v${esc(rel.version)}</span>`);
  if (main?.stargazers_count) meta.push(`<span>★ ${main.stargazers_count}</span>`);
  if (main?.license?.spdx_id && main.license.spdx_id !== 'NOASSERTION') meta.push(`<span>${esc(main.license.spdx_id)}</span>`);

  return `<article class="card" style="--cat:${c.color}" aria-labelledby="t-${p.id}">
    <span class="cat">${c.label}</span>
    <h3 id="t-${p.id}">${esc(p.title)}</h3>
    ${p.repos.length ? `<span class="repo">${p.repos.map(esc).join(' · ')}</span>` : ''}
    <p class="desc">${esc(p.desc)}</p>
    ${p.points?.length ? `<ul>${p.points.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    ${p.tags?.length ? `<div class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
    ${meta.length ? `<div class="meta">${meta.join('')}</div>` : ''}
    <div class="actions">${actions.join('')}</div>
  </article>`;
}

function matches(p) {
  if (state.cat !== 'all' && p.cat !== state.cat) return false;
  if (!state.q) return true;
  const hay = [p.title, p.desc, ...(p.points || []), ...(p.tags || []), ...p.repos, CATS[p.cat].label].join(' ').toLowerCase();
  return state.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

function renderChips() {
  const counts = { all: PROJECTS.length };
  for (const p of PROJECTS) counts[p.cat] = (counts[p.cat] || 0) + 1;
  const keys = ['all', ...Object.keys(CATS).filter(k => counts[k])];
  $('#chips').innerHTML = keys.map(k =>
    `<button class="chip" type="button" data-cat="${k}" aria-pressed="${state.cat === k}">${k === 'all' ? '전체' : CATS[k].label}<span class="n">${counts[k]}</span></button>`
  ).join('');
}

function renderGrid() {
  let list = PROJECTS.filter(matches);
  if (state.sort === 'recent') list = [...list].sort((a, b) => updatedAt(b).localeCompare(updatedAt(a)));
  $('#grid').innerHTML = list.length
    ? list.map(card).join('')
    : `<div class="empty">찾는 프로젝트가 없습니다. 검색어를 바꾸거나 <button class="btn" type="button" id="reset">전체 보기</button></div>`;
  $('#count').textContent = `프로젝트 ${list.length}개 표시 중`;
}

function renderQuick() {
  const items = PROJECTS.filter(p => p.live || p.release);
  $('#quick').innerHTML = items.map(p => {
    const c = CATS[p.cat];
    const href = p.live || '#t-' + p.id;
    const kind = p.live ? '웹' : '설치';
    return `<a class="tile" style="--cat:${c.color}" href="${href}"${p.live ? '' : ` data-jump="${p.id}"`}>
      <span class="mono" aria-hidden="true">${esc(p.mono)}</span>
      <span><b>${esc(p.title)}</b><span>${c.label}</span></span>
      <span class="kind">${kind}</span>
    </a>`;
  }).join('');
}

function renderPractice() {
  const names = Object.keys(PRACTICE);
  $('#practice-n').textContent = `(${names.length})`;
  $('#practice-list').innerHTML = names.map(n => {
    const r = state.repos[n];
    const page = r?.has_pages || n === 'test261026' ? `<a class="btn" href="${PAGES}/${n}/">${ICON.open} 열기</a>` : '';
    return `<li><span class="t"><b>${esc(n)}</b><span>${esc(PRACTICE[n])}${r?.pushed_at ? ` · ${ago(r.pushed_at)}` : ''}</span></span>
      ${page}<a class="btn" href="${GH}/${n}" aria-label="${esc(n)} 소스 (GitHub)">${ICON.code} 소스</a></li>`;
  }).join('');
}

function render() { renderChips(); renderGrid(); }

// 소개 목록에 없는 새 공개 저장소는 '기타' 카드로 자동 추가
function addUnknownRepos() {
  const known = new Set([...PROJECTS.flatMap(p => p.repos), ...Object.keys(PRACTICE), ...HIDE]);
  for (const r of Object.values(state.repos)) {
    if (known.has(r.name) || r.fork || r.archived) continue;
    PROJECTS.push({
      id: 'x-' + r.name.replace(/[^\w-]/g, ''), cat: 'etc', title: r.name, mono: r.name[0].toUpperCase(), repos: [r.name],
      live: r.homepage || (r.has_pages ? `${PAGES}/${r.name}/` : ''),
      desc: r.description || '설명이 아직 없습니다.', tags: r.language ? [r.language] : [],
    });
  }
}

async function getJSON(url) {
  const key = 'gh:' + url;
  try {
    const hit = JSON.parse(sessionStorage.getItem(key));
    if (hit && Date.now() - hit.t < 10 * 60 * 1000) return hit.v;
  } catch {}
  const res = await fetch(url, { headers: { Accept: 'application/vnd.github+json' } });
  if (!res.ok) throw new Error(res.status);
  const v = await res.json();
  try { sessionStorage.setItem(key, JSON.stringify({ t: Date.now(), v })); } catch {}
  return v;
}

function assetLabel(name) {
  if (/\.apk$/i.test(name)) return 'Android';
  if (/\.exe$/i.test(name)) return 'Windows';
  return null;
}

function pickRelease(rel) {
  const assets = [];
  for (const a of rel.assets || []) {
    const label = assetLabel(a.name);
    if (label && !assets.some(x => x.label === label)) assets.push({ label, url: a.browser_download_url });
  }
  assets.sort((a, b) => (b.label === 'Windows') - (a.label === 'Windows'));
  const version = (rel.tag_name || '').replace(/^.*?v(?=\d)/, '');
  return { version, assets, page: rel.html_url, date: rel.published_at };
}

async function loadLive() {
  const [repos, multi, listup] = await Promise.allSettled([
    getJSON(`https://api.github.com/users/${USER}/repos?per_page=100&type=owner`),
    getJSON(`https://api.github.com/repos/${USER}/releases/releases?per_page=100`),
    getJSON(`https://api.github.com/repos/${USER}/ListUp/releases/latest`),
  ]);
  if (repos.status === 'fulfilled') {
    for (const r of repos.value) if (!r.private) state.repos[r.name] = r;
    addUnknownRepos();
  }
  for (const p of PROJECTS) {
    if (!p.release) continue;
    if (p.release.prefix && multi.status === 'fulfilled') {
      const re = new RegExp(`^${p.release.prefix}-v\\d`);
      const rel = multi.value.find(r => !r.draft && !r.prerelease && re.test(r.tag_name));
      if (rel) state.releases[p.id] = pickRelease(rel);
    } else if (p.release.repo === 'ListUp' && listup.status === 'fulfilled') {
      state.releases[p.id] = pickRelease(listup.value);
    }
  }
  renderQuick(); render(); renderPractice();
}

// theme
const root = document.documentElement;
try { const t = localStorage.getItem('theme'); if (t) root.dataset.theme = t; } catch {}
$('#theme').addEventListener('click', () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', root.dataset.theme); } catch {}
});

// events
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  state.cat = b.dataset.cat;
  history.replaceState(null, '', state.cat === 'all' ? location.pathname : '#' + state.cat);
  render();
});
$('#q').addEventListener('input', e => { state.q = e.target.value.trim(); renderGrid(); });
$('#sort').addEventListener('change', e => { state.sort = e.target.value; renderGrid(); });
$('#grid').addEventListener('click', e => {
  if (e.target.id !== 'reset') return;
  state.cat = 'all'; state.q = ''; $('#q').value = ''; render();
});
$('#quick').addEventListener('click', e => {
  const t = e.target.closest('[data-jump]'); if (!t) return;
  e.preventDefault();
  state.cat = 'all'; state.q = ''; $('#q').value = ''; render();
  const el = document.getElementById('t-' + t.dataset.jump).closest('.card');
  el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' });
  el.querySelector('.actions a')?.focus({ preventScroll: true });
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape' && document.activeElement === $('#q') && $('#q').value) { $('#q').value = ''; state.q = ''; renderGrid(); }
});

const hashCat = location.hash.slice(1);
if (CATS[hashCat]) state.cat = hashCat;
renderQuick(); render(); renderPractice();
loadLive().catch(() => {});
</script>
